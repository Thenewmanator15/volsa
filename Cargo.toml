[workspace]
resolver = "3"
members = [
    "crates/voxa-core",
    "crates/voxa-dicom",
    "crates/voxa-volume",
    "crates/voxa-labels",
    "crates/voxa-models",
    "crates/voxa-segment",
    "crates/voxa-render",
    "crates/voxa-app",
    "xtask",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

# One place for every version. A crate opts in with `name.workspace = true`.
[workspace.dependencies]
voxa-core = { path = "crates/voxa-core" }
voxa-dicom = { path = "crates/voxa-dicom" }
voxa-volume = { path = "crates/voxa-volume" }
voxa-labels = { path = "crates/voxa-labels" }
voxa-models = { path = "crates/voxa-models" }
voxa-segment = { path = "crates/voxa-segment" }
voxa-render = { path = "crates/voxa-render" }

thiserror = "2"
tracing = "0.1"
rayon = "1.12"
bytemuck = { version = "1.25", features = ["derive"] }
half = "2.7"
pollster = "0.4"

# Interface. The only wgpu in the tree is the one egui-wgpu re-exports.
eframe = { version = "0.36", default-features = false }
egui = "0.36"
egui-wgpu = "0.36"
rfd = "0.17"

# DICOM and archives.
# The dicom-rs crates are taken one by one, not through the `dicom` umbrella crate, which would
# also bring in its network protocol code.
dicom-core = "0.10"
dicom-object = "0.10"
dicom-dictionary-std = "0.10"
dicom-pixeldata = { version = "0.10", default-features = false, features = ["native", "openjp2", "rayon"] }
dicom-transfer-syntax-registry = { version = "0.10", default-features = false }
# Stored and deflated entries cover scan exports; the other compressors would only add code to audit.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Label volumes are usually gzipped (.nii.gz). The same pure-Rust inflater `zip` already uses.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

# Saved views: an open file format, in the folder the system gives for settings.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"

# The sum that tells a network file is the one its list names.
sha2 = "0.11"

# ONNX Runtime, which runs the networks. Its library is loaded when Voxa runs, from a folder
# the person names: nothing is linked or fetched when Voxa is built. Pinned to one release,
# the one the networks were measured with. The crate that uses it adds `directml` on Windows.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }
# The system's own list of graphics adapters, on Windows. The version wgpu already brings.
windows = { version = "0.62.2", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

# Tests and benchmarks.
proptest = "1.11"
tempfile = "3.27"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
criterion = "0.8"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "deny"
# Pedantic lints switched off, each for a stated reason:
module_name_repetitions = "allow" # `voxa_dicom::DicomSource`-style names read better at the call site
must_use_candidate = "allow"      # would put #[must_use] on nearly every getter
cast_precision_loss = "allow"     # counts and indices become f64 for geometry; values stay far below 2^52

# The JPEG 2000 decoder frees a null pointer as it tidies up after a picture. A build with
# debug checks stops the whole program for that, so a debug build could not open a JPEG 2000
# scan at all. The checks are off for that one crate, which is also built for speed: decoding
# is most of the wait when a scan is opened.
[profile.dev.package.openjp2]
debug-assertions = false
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
