[package]
name = "xtask"
description = "Project tasks for Voxa: `cargo xtask check`, `cargo xtask coverage` and `cargo xtask notices`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Reads what `cargo metadata` says of the packages Voxa is built from.
serde_json.workspace = true

[dev-dependencies]
# The made-up package folders the notices are tested on.
tempfile.workspace = true

[lints]
workspace = true
