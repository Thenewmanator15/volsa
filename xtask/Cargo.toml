[package]
name = "xtask"
description = "Project tasks for Volsa: `cargo xtask check`, `coverage`, `check-models`, `notices` and `dist`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Reads what `cargo metadata` says of the packages Volsa is built from.
serde_json.workspace = true
# Writes the zip a release offers.
zip.workspace = true

[dev-dependencies]
# The made-up package folders the notices are tested on.
tempfile.workspace = true

[lints]
workspace = true
