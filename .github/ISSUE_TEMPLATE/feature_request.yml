name: Ask for something new
description: Something Voxa does not do yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach a scan, a scan export (DICOM files, or a folder or zip of them), a label file made from a scan, or a screenshot that shows patient details, and never paste tag values from the Tags window.** Anyone can read an issue.

        Voxa is not a medical device and is not for diagnostic use. It makes no network connections and has no telemetry, so it will not make a diagnosis or send anything off the computer.
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: What you are trying to do, and what stands in the way now.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working, if you have an idea.
  - type: textarea
    id: instead
    attributes:
      label: What you do now instead
      description: Another program or a way round, if there is one.
  - type: checkboxes
    id: nothing-private
    attributes:
      label: Nothing private
      options:
        - label: This request holds no scan, scan export, label file made from a scan, screenshot that shows patient details, or tag value.
          required: true
