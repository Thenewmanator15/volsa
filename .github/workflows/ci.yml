name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show
      - name: Software Vulkan driver, so the GPU tests run without a graphics card
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libgtk-3-dev
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Every quality gate
        run: cargo xtask check

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show
      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov
      - name: Coverage floor on the crates that need no GPU
        run: cargo xtask coverage

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show
      - name: Build Voxa as it would be handed to someone
        run: cargo build --release -p voxa-app
      - name: Keep the program
        uses: actions/upload-artifact@v4
        with:
          name: voxa-windows
          path: target/release/voxa-app.exe
          if-no-files-found: error
