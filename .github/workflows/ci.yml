name: ci

on:
  # Pushes of branches only. A tag that makes a release is checked by the release workflow,
  # which runs this one before it builds anything.
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

# Every action is pinned by its full commit, with the release it is beside it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the pinned toolchain
        run: rustup show
      - name: Software Vulkan driver, so the GPU tests run without a graphics card
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libgtk-3-dev
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Every quality gate
        run: cargo xtask check

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the pinned toolchain
        run: rustup show
      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov
      - name: Coverage floor on the crates that need no GPU
        run: cargo xtask coverage

  book:
    # The user guide in book/, built as docs.yml builds it to publish it: a page SUMMARY.md
    # names that is missing, or a file a page includes, fails here. The gate's tests hold its
    # words and its links.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install mdBook, pinned and checked
        uses: ./.github/actions/install-mdbook
      - name: Build the user guide
        run: mdbook build book

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the pinned toolchain
        run: rustup show
      - name: Build Volsa and pack it as it would be handed to someone, without the runtime
        run: cargo xtask dist
      - name: Keep the package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: volsa-windows
          path: target/dist/volsa-*-windows-x64.zip
          if-no-files-found: error
