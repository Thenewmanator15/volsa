name: release

# A tag such as v0.5.0 makes a draft release of that version: every check in ci.yml first,
# then the Windows package with ONNX Runtime in it, the package's SHA-256, and that version's
# section of CHANGELOG.md as the notes. Nothing is published: a person looks at the draft on
# GitHub and publishes it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # ONNX Runtime with DirectML, from Microsoft's package on nuget.org. The package is taken
  # only if its SHA-256 is this one, pinned here by a person who downloaded it once and
  # checked it: 64 hexadecimal digits in lower case.
  ORT_VERSION: "1.24.4"
  ORT_SHA256: ""

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  package:
    needs: checks
    runs-on: windows-latest
    permissions:
      # To make the draft release and attach the package to it, with GITHUB_TOKEN.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show

      - name: The tag names the version in Cargo.toml
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $described = cargo metadata --format-version 1 --no-deps --locked | ConvertFrom-Json
          $declared = ($described.packages | Where-Object name -eq 'voxa-app').version
          if ($version -ne $declared) {
            throw "The tag $env:GITHUB_REF_NAME does not name version $declared, which Cargo.toml gives."
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Take the notes from that version's section of the changelog
        shell: bash
        run: |
          mkdir -p target/dist
          awk -v heading="## [$VERSION]" '
            index($0, "## [") == 1 { if (found) exit; found = (index($0, heading) == 1); next }
            found { print }
          ' CHANGELOG.md > target/dist/notes.md
          if ! grep -q '[^[:space:]]' target/dist/notes.md; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi

      - name: Take ONNX Runtime from Microsoft's package, if its SHA-256 is the one pinned
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:ORT_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
            throw "ORT_SHA256 in release.yml is not set: pin the SHA-256 of Microsoft.ML.OnnxRuntime.DirectML $env:ORT_VERSION from nuget.org."
          }
          $package = Join-Path $env:RUNNER_TEMP 'onnxruntime.zip'
          $url = "https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime.DirectML/$env:ORT_VERSION"
          Invoke-WebRequest -Uri $url -OutFile $package
          $sum = (Get-FileHash -Algorithm SHA256 -Path $package).Hash.ToLowerInvariant()
          if ($sum -ne $env:ORT_SHA256) {
            throw "The package's SHA-256 is $sum, not $env:ORT_SHA256 as pinned in release.yml."
          }
          $unpacked = Join-Path $env:RUNNER_TEMP 'onnxruntime'
          Expand-Archive -Path $package -DestinationPath $unpacked
          $runtime = Join-Path $env:RUNNER_TEMP 'runtime'
          New-Item -ItemType Directory -Path $runtime | Out-Null
          $native = Join-Path $unpacked 'runtimes\win-x64\native'
          foreach ($library in 'onnxruntime.dll', 'onnxruntime_providers_shared.dll') {
            Copy-Item -Path (Join-Path $native $library) -Destination $runtime
          }
          # The package's own licence and notices go with the runtime, under these names.
          foreach ($notice in 'LICENSE', 'ThirdPartyNotices') {
            $found = Get-ChildItem -Path $unpacked -File |
              Where-Object Name -match "^$notice(\.txt)?$" | Select-Object -First 1
            if (-not $found) { throw "The package holds no $notice." }
            $name = if ($notice -eq 'LICENSE') { 'LICENSE' } else { 'ThirdPartyNotices.txt' }
            Copy-Item -Path $found.FullName -Destination (Join-Path $runtime $name)
          }
          "RUNTIME=$runtime" >> $env:GITHUB_ENV

      - name: Build Voxa and pack it with the runtime
        run: cargo xtask dist --runtime "$env:RUNTIME"

      - name: Write the package's SHA-256 beside it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "voxa-$env:VERSION-windows-x64.zip"
          $dist = (Resolve-Path 'target/dist').Path
          $sum = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $dist $name)).Hash.ToLowerInvariant()
          # The form sha256sum reads: the sum, two spaces, the file's name, a line feed.
          $file = Join-Path $dist "$name.sha256"
          [System.IO.File]::WriteAllText($file, "$sum  $name`n")
          Get-Content $file

      - name: Make a draft release of the tag, with the package and its SHA-256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "Voxa $VERSION" \
            --notes-file target/dist/notes.md \
            "target/dist/voxa-$VERSION-windows-x64.zip" \
            "target/dist/voxa-$VERSION-windows-x64.zip.sha256"
