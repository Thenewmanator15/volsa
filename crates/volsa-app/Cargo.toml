[package]
name = "volsa-app"
description = "The Volsa desktop application: interface, state and background work."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
volsa-core.workspace = true
volsa-dicom.workspace = true
volsa-volume.workspace = true
volsa-labels.workspace = true
volsa-models.workspace = true
volsa-segment.workspace = true
volsa-render.workspace = true
rayon.workspace = true
rfd.workspace = true
# `accesskit` describes the interface to screen readers.
eframe = { workspace = true, features = ["accesskit", "wgpu", "default_fonts", "x11", "wayland"] }
image.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde_json.workspace = true
directories.workspace = true

# Builds on Windows give volsa.exe its icon and version details.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[dev-dependencies]
volsa-dicom = { workspace = true, features = ["testkit"] }
volsa-labels = { workspace = true, features = ["testkit"] }
volsa-models = { workspace = true, features = ["testkit"] }
tempfile.workspace = true
zip.workspace = true
criterion.workspace = true

# The program is `volsa.exe`; the package keeps its name.
[[bin]]
name = "volsa"
path = "src/main.rs"

[[bench]]
name = "decode"
harness = false

[lints]
workspace = true
