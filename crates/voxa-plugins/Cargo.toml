[package]
name = "voxa-plugins"
description = "Models people add to Voxa themselves: reading and checking a plugin folder, preparing a scan by the plugin's description, running its network in a helper process, and making its answer a label set."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
voxa-labels.workspace = true
voxa-models.workspace = true
voxa-segment.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile = { workspace = true, optional = true }

[features]
# Builders of made-up plugin folders, for this crate's tests and for the crates above it.
testkit = ["dep:tempfile"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
