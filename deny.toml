# Checked by `cargo deny check` (part of `cargo xtask check`).

[advisories]
version = 2
yanked = "deny"
ignore = [
    # The DICOM library reads the text encodings of names and descriptions with the `encoding`
    # crate and offers no other choice. The notice says the crate is no longer maintained, not
    # that it has a known flaw. Remove this once dicom-encoding moves to `encoding_rs`.
    { id = "RUSTSEC-2021-0153", reason = "required by dicom-encoding 0.10; unmaintained, no known vulnerability" },
    # The interface library's accessibility code reaches the Linux desktop's screen readers over
    # D-Bus with zbus 5, which uses these three crates. They were folded into zbus 6 and are no
    # longer kept up on their own; the notices name no flaw. They come only through accesskit on
    # Linux, and no release of accesskit for this egui moves to zbus 6, so there is no safe
    # upgrade yet. Remove these once egui's accesskit does.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: only through accesskit on Linux (zbus 5); unmaintained, no known vulnerability, no safe upgrade" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: only through accesskit on Linux (zbus 5); unmaintained, no known vulnerability, no safe upgrade" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: only through accesskit on Linux (zbus 5); unmaintained, no known vulnerability, no safe upgrade" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    # A public-domain dedication; the text-encoding tables under the DICOM library use it.
    "CC0-1.0",
    # The Independent JPEG Group's licence, on the JPEG code under the DICOM library. It asks
    # that documentation shipped with a program say so; the README carries the sentence.
    "IJG",
    # The typefaces bundled with the interface library (Ubuntu, Hack, Noto Emoji). Both
    # licences allow shipping the fonts inside a program; the README names them.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # The Boost licence, on the Windows clipboard code under the interface library.
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Crates in this workspace depend on each other by path and are never published.
allow-wildcard-paths = true
# A second copy of wgpu would mean two GPU devices that cannot share textures.
deny = [{ crate = "wgpu", deny-multiple-versions = true }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
